<!DOCTYPE html>
<html>
  <head>
    <title>My first Vue app</title>
    <script src="https://unpkg.com/vue"></script>
  </head>
  <body>
    <div id="app">
      <button v-on:click="seen = !seen">
        <p v-if="seen">HIDE</p>
        <p v-else>SHOW</p>
      </button>
      <div v-if="seen">
        {{ message }}
      </div>
    </div>

    <script>
      var app = new Vue({
        el: "#app",
        data: {
          message: "Hello Vue!",
          seen: true
        }
      });
    </script>
  </body>
</html>
